name: Bump version and make a release

# Manual escape hatch / first release: pick a bump, it tags and invokes release.
# Day-to-day, ci.yml auto-releases from Conventional Commits on green main.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to bump'
        required: true
        type: choice
        options: [patch, minor, major]
      match_readonly:
        # This is the reachable form of the MATCH_READONLY hatch the entitlement
        # verify gate points operators at: if a profile stops authorising a
        # capability (e.g. App Groups was just associated on the App IDs), run a
        # release with this set to 'false' so match regenerates the profiles.
        # Requires a *write* MATCH_REPO_KEY and an API key allowed to manage
        # profiles. Leave it 'true' otherwise.
        description: "Let match regenerate provisioning profiles"
        required: false
        type: choice
        options: ['true', 'false']
        default: 'true'

permissions:
  contents: write

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute new tag
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LATEST=${LATEST:-v0.0.0}
          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping $LATEST -> $NEW_TAG"

      - name: Push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"

  release:
    name: Trigger release
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.new_tag }}
      match_readonly: ${{ inputs.match_readonly }}
    # Called workflows get NO repository secrets unless the caller forwards
    # them; without this the signing steps see only empty strings.
    secrets: inherit
    permissions:
      contents: write

# XcodeGen project definition. Run `xcodegen generate` to produce
# EveryByteCounts.xcodeproj, then open it in Xcode.
#
# Why XcodeGen: an iOS app + widget extension needs an .xcodeproj, but a
# hand-written project.pbxproj is fragile and noisy in diffs. This declarative
# spec assembles the three pieces from the design (§4) — the app, the widget
# extension, and the shared MobileDataCore package — into a buildable project.
name: EveryByteCounts

options:
  bundleIdPrefix: fi.mailhub.everybytecounts
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# The Shared Core lives in this repo as a local Swift package; both targets link it.
packages:
  MobileDataCore:
    path: .

# Version lives in Config/Version.xcconfig, not here: the release pipeline
# rewrites it after each release, and an xcconfig can be rewritten wholesale
# instead of regex-patched. Do NOT re-add MARKETING_VERSION or
# CURRENT_PROJECT_VERSION below — settings here are written into the generated
# project and out-rank the xcconfig, so a copy here would silently win.
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set your Apple Developer team id before signing

targets:
  EveryByteCounts:
    type: application
    platform: iOS
    sources:
      - App/EveryByteCounts
    # CODE_SIGN_ENTITLEMENTS lives in this xcconfig rather than in an
    # `entitlements:` key here — that key makes XcodeGen *generate* the plist and,
    # with no `properties:`, overwrite the checked-in .entitlements file with an
    # empty dict on every run, silently dropping the App Group from releases.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.mailhub.everybytecounts
        INFOPLIST_FILE: App/EveryByteCounts/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # No signing settings live here. fastlane owns Release signing: `match`
      # syncs the cert + profiles and `update_code_signing_settings` stamps them
      # into the generated project at build time (see fastlane/Fastfile). This
      # decouples the project from any specific profile name — a chunk of the
      # old XcodeGen pain. Debug keeps Xcode's automatic signing so the simulator
      # and local dev work without any of these profiles.
    dependencies:
      - package: MobileDataCore
        product: MobileDataCore
      - target: EveryByteCountsWidgetExtension
    scheme: {}

  EveryByteCountsWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget/EveryByteCountsWidget
    # Entitlements via xcconfig, same reason as the app target above.
    configFiles:
      Debug: Config/Widget.xcconfig
      Release: Config/Widget.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.mailhub.everybytecounts.widget
        INFOPLIST_FILE: Widget/EveryByteCountsWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      # Signing is injected by fastlane at build time, same as the app target.
    dependencies:
      - package: MobileDataCore
        product: MobileDataCore
